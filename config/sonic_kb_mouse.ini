# ==============================================================================
# Sonic Free Riders - PC Keyboard & Mouse Configuration
# Mod by @mrunemployed
# ==============================================================================
# Custom keybindings and mouse tuning for Sonic Free Riders on PC (Xenia Canary).
# Supports all standard keys: A-Z, 0-9, F1-F12, SPACE, ENTER, ESCAPE, TAB,
# BACKSPACE, SHIFT, CTRL, ALT, UP, DOWN, LEFT, RIGHT, TILDE,
# MOUSE_LEFT, MOUSE_RIGHT, MOUSE_MIDDLE, MOUSE_4, MOUSE_5.
# Multiple keys can be separated by commas (e.g. steer_left = A, LEFT).
# ==============================================================================

[Controls]
input_mode = 0                    # 0 = Keyboard + Mouse, 1 = Keyboard Only
mouse_steering_sensitivity = 1200.0   # Left stick steering responsiveness (higher = sharper turn)
mouse_cursor_sensitivity   = 1.6      # Right stick cursor responsiveness across menus
mouse_capture              = 1        # 1 = Enable mouse tracking, 0 = Disable
mouse_locked_default       = 1        # 1 = Lock cursor into game window on start, 0 = Unlocked

[Hotkeys]
# Changed from F1/F2 to F8/F9 to avoid overlapping with Xenia emulator shortcuts
hotkey_mouse_lock = F8            # Toggle Cursor Lock / Unlock to Desktop
hotkey_input_mode = F9            # Toggle Mode (Keyboard+Mouse vs Keyboard-Only)

[Keybindings]
# --- Racing Controls ---
steer_left    = A, LEFT           # Steer Board Left
steer_right   = D, RIGHT          # Steer Board Right
lean_forward  = W, UP             # Lean Forward (Speed Tuck Acceleration)
lean_back     = S, DOWN           # Lean Back (Brake / Air Control)
drift_left    = Q, MOUSE_4        # Classic Riders Drift Left (Sharp Carve + Boost Exit)
drift_right   = E, MOUSE_5        # Classic Riders Drift Right (Sharp Carve + Boost Exit)
jump_crouch   = SPACE, Z, MOUSE_LEFT  # Crouch (Hold) / Jump (Release)
kick_dash     = LSHIFT, X, MOUSE_RIGHT # Kick Dash Charge (Hold) / Boost (Release) / Swim
use_item      = F, R, MOUSE_MIDDLE    # Use Item (Tap) / Shake Item (Hold) / Screen Wipe
tag_mode      = T, LALT           # Tag Mode Hold Hands (LT)
pause         = P, PAUSE          # Pause Game (Start)

# --- Menu & Dialog Controls ---
confirm       = ENTER, SPACE, Z, MOUSE_LEFT # Universally Confirms ANY prompt (A or X)
cancel_back   = ESCAPE, BACKSPACE, C        # Universally Cancels / Declines / Goes Back (B)
reset_cursor  = TAB               # Reset Menu Cursor Pointer to Center
toggle_cursor = Y, V              # Toggle Cursor Pointer On / Off
menu_cursor_up    = UP, I, NUMPAD8     # Move Menu Cursor Up
menu_cursor_down  = DOWN, K, NUMPAD5   # Move Menu Cursor Down
menu_cursor_left  = LEFT, J, NUMPAD4   # Move Menu Cursor Left
menu_cursor_right = RIGHT, L, NUMPAD6  # Move Menu Cursor Right
menu_ring_left    = 1, LEFT, A         # Rotate 3D Menu Carousel Left (also Mouse Wheel Up)
menu_ring_right   = 2, RIGHT, D        # Rotate 3D Menu Carousel Right (also Mouse Wheel Down)
menu_option_up    = 3, UP, W           # Menu Special Options (+- On)
menu_option_down  = 4, DOWN, S         # Menu Special Options (+- Off)
